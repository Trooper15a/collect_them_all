name: Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trooper15a/collectr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.MODEL_TOKEN }}

      - name: Trigger Coolify deploy
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          case "$COOLIFY_BASE_URL" in
            https://*) ;;
            *) echo "Set COOLIFY_BASE_URL to the verified HTTPS deployment endpoint" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 -X POST \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy" \
            --url-query "uuid=$COOLIFY_APP_UUID" --url-query 'force=true' \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
