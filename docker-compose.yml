services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collectr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collectr_dev}
      POSTGRES_DB: collectr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectr"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/trooper15a/collectr:latest
    pull_policy: always
    # To build locally instead: docker compose build --build-arg GITHUB_TOKEN=...
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://collectr:${POSTGRES_PASSWORD:-collectr_dev}@db:5432/collectr
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      POKEWALLET_API_KEY: ${POKEWALLET_API_KEY}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-30 3 * * *}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
